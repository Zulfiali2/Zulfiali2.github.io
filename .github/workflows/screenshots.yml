name: Update website screenshots

on:
  workflow_dispatch: {}          # run by hand: Actions tab → "Update website screenshots" → Run workflow
  schedule:
    - cron: "0 3 * * 1"          # every Monday 03:00 UTC
  push:
    branches: [main]
    paths: ["data.js", "tools/screenshots.mjs", ".github/workflows/screenshots.yml"]

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and sharp
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.47.2 sharp@0.33.5
          npx playwright install --with-deps chromium
      - name: Capture screenshots
        run: node tools/screenshots.mjs
      - name: Commit new screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shots
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update website screenshots"
          git push
